# simgen workers. Scale with: kubectl -n telecom-lab scale deployment simgen-worker --replicas=3
# Workers share one folder volume and claim files by atomic rename, so an order
# is processed exactly once however many replicas run.
#
# Before applying, create the keys Secret (LAB ONLY keys):
#   simgen init-keys lab-keys.json
#   kubectl -n telecom-lab create secret generic simgen-keys --from-file=lab-keys.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exchange
  namespace: telecom-lab
spec:
  accessModes: ["ReadWriteOnce"]   # fine on a one-node lab cluster; real clusters need ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logs
  namespace: telecom-lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simgen-worker
  namespace: telecom-lab
  labels: {app: simgen-worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app: simgen-worker}
  template:
    metadata:
      labels: {app: simgen-worker}
    spec:
      securityContext:
        fsGroup: 1001          # lets uid 1001 read the mounted keys Secret
      initContainers:
        # Volumes start owned by root; hand them to the simgen user (uid 1001).
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data/inbox /data/processing /data/outbox /data/archive /data/error && chown -R 1001:1001 /data /logs"]
          volumeMounts:
            - {name: exchange, mountPath: /data}
            - {name: logs, mountPath: /logs}
      containers:
        - name: worker
          image: simgen:lab
          imagePullPolicy: IfNotPresent   # built locally; OrbStack shares Docker's images
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: postgres-auth, key: url}}
            - {name: SIMGEN_KEYS, value: /keys/lab-keys.json}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: exchange, mountPath: /data}
            - {name: logs, mountPath: /logs}
            - {name: keys, mountPath: /keys, readOnly: true}
      volumes:
        - name: exchange
          persistentVolumeClaim: {claimName: exchange}
        - name: logs
          persistentVolumeClaim: {claimName: logs}
        - name: keys
          secret: {secretName: simgen-keys, defaultMode: 0440}
