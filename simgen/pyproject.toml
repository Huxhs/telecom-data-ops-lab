[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simgen"
version = "0.1.0"
description = "SIM profile generation lab: input file to output file, with QC, order tracking and Splunk-ready logs"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
oracle = ["oracledb>=2"]
dev = ["pytest>=8"]

[project.scripts]
simgen = "simgen.cli:main"

[tool.setuptools]
packages = ["simgen"]
